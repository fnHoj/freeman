<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自由度人</title>
    <style>
        :root {
            color-scheme: dark;
            text-align: center;
            font-family: monospace;
            font-size: 24px;
            user-select: none;
        }
        a {
            color: inherit;
        }
        h2, p {
            margin: 0;
        }
        #songselect > h1 {
            font-size: 72px;
            inline-size: 100%;
            margin-block: 0.5em;
        }
        #songselect {
            display: flex;
            flex-wrap: wrap;
            align-items: start;
            justify-content: center;
        }
        #songselect > a {
            background-color: #222;
            margin: 0.5em;
            padding-block-end: 0.25em;
            box-shadow: 0.25em 0.25em 1em #0006;
            border-radius: 0.5em;
            overflow: hidden;
            inline-size: 320px;
            text-decoration: none;
            block-size: max-content;
            transition: 0.3s ease;
            transition-property: background-color, transform;
        }
        #songselect > a:hover {
            background-color: #333;
            transform: translateY(-0.25em);
        }
        #songselect > a > img {
            inline-size: 100%;
        }
        .diffrow {
            font-size: 50%;
            margin-block-start: 0.5em;
        }
        .diff {
            font-weight: bold;
            display: inline-block;
            padding-inline: 0.5em;
            padding-block: 0.25em;
            border-radius: 4px;
            background: #000;
        }
        .rank-0 {
            background-color: #270;
        }
        .rank-1 {
            background-color: #860;
        }
        .rank-2 {
            background-color: #920;
        }
        .rank-3 {
            background-color: #70a;
        }
        .rank-4 {
            background-color: #daf;
            color: #000;
        }
        #player {
            display: none;
        }
        #back {
            font-size: 75%;
            position: absolute;
            inset-block-start: calc(8px + 1lh / 3);
            inset-inline-start: 12px;
        }
        canvas {
            border: 1px solid #fff;
            margin-inline: auto;
            display: block;
        }
        #t {
            display: block;
            inline-size: calc(100% - 16px);
        }
        #p, #h, #s12, #s34, #s1, #s54, #s32 {
            display: none;
        }
        label, select {
            font: inherit;
            border: none;
            display: inline-block;
            background-color: #333;
            border-radius: 4px;
            block-size: 1.5em;
            box-sizing: content-box;
            padding-block: 0.1em;
            padding-inline: 0.25em;
            vertical-align: middle;
        }
        label::before {
            vertical-align: sub;
        }
        label:hover {
            filter: invert(100%) brightness(75%) invert(100%);
        }
        #pl {
            padding-inline: 1em;
        }
        #p:not(:checked) ~ #pl::before {
            content: "▶︎ 播放";
        }
        #p:checked ~ #pl::before {
            content: "◼︎ 暂停";
        }
        #hl {
            padding-inline: 0.5em;
        }
        #h:not(:checked) ~ #hl::before {
            content: "显示手位";
        }
        #h:checked ~ #hl::before {
            content: "隐藏手位";
        }
        #p:checked ~ #pl, #h:checked ~ #hl {
            background-color: #9cf;
            color: #000;
        }
        #sl12::before {
            content: "0.5x";
        }
        #s12:checked ~ #sl12 {
            background-color: #9cf;
            color: #000;
        }
        #sl34::before {
            content: "0.75x";
        }
        #s34:checked ~ #sl34 {
            background-color: #9cf;
            color: #000;
        }
        #sl1::before {
            content: "1x";
        }
        #s1:checked ~ #sl1 {
            background-color: #9cf;
            color: #000;
        }
        #sl54::before {
            content: "1.25x";
        }
        #s54:checked ~ #sl54 {
            background-color: #9cf;
            color: #000;
        }
        #sl32::before {
            content: "1.5x";
        }
        #s32:checked ~ #sl32 {
            background-color: #9cf;
            color: #000;
        }
    </style>
</head>
<body>
    <div id="songselect"></div>
    <div id="player">
        <a id="back" href=".">← 乐曲选择</a>
        <p id="title"></p>
        <canvas id="canvas" width="1280px" height="720px"></canvas>
        <input id="t" type="range" step="0.1"/>
        <input id="p" type="checkbox"/>
        <input id="h" type="checkbox"/>
        <input id="s12" name="s" type="radio"/>
        <input id="s34" name="s" type="radio"/>
        <input id="s1" name="s" type="radio" checked="checked"/>
        <input id="s54" name="s" type="radio"/>
        <input id="s32" name="s" type="radio"/>
        <label id="pl" for="p"></label>
        <label id="sl12" for="s12"></label>
        <label id="sl34" for="s34"></label>
        <label id="sl1" for="s1"></label>
        <label id="sl54" for="s54"></label>
        <label id="sl32" for="s32"></label>
        <select id="diff"></select>
        <label id="hl" for="h"></label>
        <canvas id="map" width="350px" height="350px"></canvas>
    </div>

    <script src="dist/vec.js"></script>
    <script src="dist/beatmap.js"></script>
    <script src="dist/render.js"></script>
    <script src="dist/main.js"></script>
</body>
</html>
