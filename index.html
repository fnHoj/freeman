<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自由度人</title>
    <style>
        :root {
            color-scheme: dark;
            text-align: center;
        }
        canvas {
            border: 1px solid #fff;
            margin-inline: auto;
            display: block;
        }
        #t {
            display: block;
            inline-size: calc(100% - 16px);
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="1280px" height="720px"></canvas>
    <input id="t" type="range" min="-8" max="936" step="0.1" value="-8"/>
    <input id="p" type="checkbox"/>
    <canvas id="map" width="350px" height="350px"></canvas>

    <script src="dist/vec.js"></script>
    <script src="dist/beatmap.js"></script>
    <script src="dist/render.js"></script>
    <script src="dist/main.js"></script>
</body>
</html>
